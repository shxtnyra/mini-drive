version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini_drive_db
    environment:
      POSTGRES_DB: mini_drive
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-6792}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - drive_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d mini_drive"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  redis:
    image: redis:7-alpine
    container_name: mini_drive_redis
    networks:
      - drive_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_driver_backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # db
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/mini_drive
      DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-6792}
      # Redis
      REDIS_HOST: redis
      # Mail (из .env файла)
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      
      # JWT
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}

      # Admin Bootstrap
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Storage (внутри контейнера это будет путь в volume)
      STORAGE_LOCAL_BASE_PATH: /app/storage
    depends_on: 
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - file_storage:/app/storage # Здесь будут лежать загруженные файлы
    networks:
    - drive_network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: mini_driver_frontend
  #   ports:
  #     - "${REACT_LOCAL_PORT}:80"
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
  file_storage:

networks:
  drive_network:
    driver: bridge